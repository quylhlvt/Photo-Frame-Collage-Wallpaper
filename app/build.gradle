plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.depthwallpaper'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.depthwallpaper"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        def formattedDate = new Date().format('MM.dd.yyyy')
        archivesBaseName = "ST172_Photo_Frame_Collage_Wallpaper_${versionName}_${formattedDate}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    bundle {
        language {
            enableSplit = false
        }
        density {
            // This property is set to true by default.
            enableSplit = true
        }
        abi {
            // This property is set to true by default.
            enableSplit = true
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.play.review.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.media3.transformer
    implementation libs.androidx.media3.effect
    implementation libs.androidx.media3.common
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core


    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-analytics-ktx")
    implementation("com.google.firebase:firebase-crashlytics-ktx")
    implementation("com.google.firebase:firebase-messaging-ktx")
    implementation("com.google.firebase:firebase-config-ktx")
    //lotte
    implementation("com.airbnb.android:lottie:6.7.1")
    //quy
    implementation("com.github.lehongquyme:roundedframelayout:release~v1.1")
    implementation ("com.github.lehongquyme:canvasShadow:release~v1.0.1")
    //dot
    implementation("com.tbuonomo:dotsindicator:5.1.0")

    // Room: the photos the user added on the Choose photo screen.
    implementation("androidx.room:room-runtime:2.7.2")
    implementation("androidx.room:room-ktx:2.7.2")
    ksp("androidx.room:room-compiler:2.7.2")
}
